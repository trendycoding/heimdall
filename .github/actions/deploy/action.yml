name: "Deploy"
description: "Build and push container image, then deploy to Azure (Container Apps or App Service)"

inputs:
  azure-client-id:
    description: "Azure AD client ID for OIDC auth"
    required: true
  azure-tenant-id:
    description: "Azure AD tenant ID"
    required: true
  azure-subscription-id:
    description: "Azure subscription ID"
    required: true
  registry:
    description: "Container registry (e.g., ghcr.io)"
    required: true
  image-name:
    description: "Full image name without tag"
    required: true
  image-tag:
    description: "Image tag (typically commit SHA)"
    required: true
  resource-group:
    description: "Azure resource group name"
    required: true
  app-name:
    description: "Azure Container App or App Service name"
    required: true
  environment:
    description: "Target environment (development, staging, production)"
    required: true
  registry-username:
    description: "Container registry username"
    required: true
  registry-password:
    description: "Container registry password/token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push container image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          ${{ inputs.registry }}/${{ inputs.image-name }}:latest

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Deploy to Container Apps (production)
      if: inputs.environment == 'production'
      shell: bash
      run: |
        az containerapp update \
          --name ${{ inputs.app-name }} \
          --resource-group ${{ inputs.resource-group }} \
          --image ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}

    - name: Deploy to App Service (dev/staging)
      if: inputs.environment != 'production'
      shell: bash
      run: |
        az webapp config container set \
          --name ${{ inputs.app-name }} \
          --resource-group ${{ inputs.resource-group }} \
          --container-image-name ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }} \
          --container-registry-url https://${{ inputs.registry }} \
          --container-registry-user ${{ inputs.registry-username }} \
          --container-registry-password ${{ inputs.registry-password }}

        az webapp restart \
          --name ${{ inputs.app-name }} \
          --resource-group ${{ inputs.resource-group }}
