name: Deploy to Production

on:
  push:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/heimdall-api
  ENVIRONMENT: production
  AZURE_RESOURCE_GROUP: rg-heimdall-prod
  AZURE_CONTAINER_APP: ca-heimdall-prod

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Database Migration
    needs: ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply database migrations
        uses: ./.github/actions/migrate
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          connection-string: ${{ secrets.SQL_CONNECTION_STRING }}
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Database migration stage failed. EF Core migration could not be applied to production database."
          exit 1

  approve:
    name: Manual Approval
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production-approval

    steps:
      - name: Approval gate
        run: echo "Production deployment approved by required reviewers."

  deploy:
    name: Deploy API
    needs: [ci, migrate, approve]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure
        uses: ./.github/actions/deploy
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ github.sha }}
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          app-name: ${{ env.AZURE_CONTAINER_APP }}
          environment: ${{ env.ENVIRONMENT }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deploy stage failed. Could not deploy container to production Container Apps."
          exit 1

  deploy-admin-portal:
    name: Deploy Admin Portal
    needs: [ci, migrate, approve]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy Admin Portal
        uses: ./.github/actions/admin-portal-build
        with:
          node-version: "20"
          deploy: "true"
          azure-static-web-apps-api-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Admin Portal deploy stage failed. Could not deploy to Static Web App."
          exit 1
