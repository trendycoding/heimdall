# Development overrides — applied automatically by `docker compose up`
# Provides local SQL Server, Azurite (Azure Storage emulator), and optional Redis.
# The API runs outside Docker (via `dotnet run`) with ASPNETCORE_ENVIRONMENT=Development,
# which configures in-memory caching and enables Swagger UI.
services:
  sqlserver:
    environment:
      - MSSQL_SA_PASSWORD=Heimdall_Dev_P@ss1
      - MSSQL_MEMORY_LIMIT_MB=2048
    restart: unless-stopped

  azurite:
    restart: unless-stopped

  redis:
    restart: unless-stopped
    profiles:
      - with-redis
